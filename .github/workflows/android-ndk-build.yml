name: Android build

on:
  push:
    branches: [main, feature/android-showcase-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Build, test, lint, and verify the signed native APK
        shell: pwsh
        run: |
          $env:GRADLE_USER_HOME = Join-Path $env:USERPROFILE '.gradle'
          & ./scripts/build-android-windows.ps1 -Python (Get-Command python.exe).Source
      - uses: actions/upload-artifact@v4
        with:
          name: MobilePlay-Android-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-and-lint-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
