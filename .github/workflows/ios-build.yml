name: iPadOS build

on:
  push:
    branches: [feature/ipados-native]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          git -C vendor/chiaki-ng rev-parse HEAD

      - name: Install tools
        run: |
          brew install cmake ninja xcodegen
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Build ChiakiKit.xcframework (device + simulator)
        run: scripts/build-chiaki.sh 2>&1 | tee ../chiaki-build.log

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test (iPad simulator, unsigned)
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -m1 -oE 'iPad[^()]*' | sed 's/ *$//')
          echo "Using simulator: $DEST"
          xcodebuild -project MobilePlay.xcodeproj -scheme MobilePlay \
            -sdk iphonesimulator -destination "platform=iOS Simulator,name=$DEST" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ../xcodebuild-test.log

      - name: Package unsigned device IPA (for sideloading)
        run: VERSION=0.1.0 BUILD_NUMBER=${{ github.run_number }} scripts/package-ipa.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            chiaki-build.log
            xcodebuild-test.log

      - uses: actions/upload-artifact@v4
        with:
          name: MobilePlay-unsigned-ipa
          path: ios/build/MobilePlay.ipa
